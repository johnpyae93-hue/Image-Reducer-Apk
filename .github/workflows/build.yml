name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Generate Keystore & Sign APK
        run: |
          keytool -genkey -v -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias mykey -storepass 123456 -keypass 123456 \
            -dname "CN=John P, OU=App, O=ImageReducer, L=Yangon, ST=Yangon, C=MM"

          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          $BUILD_TOOLS/zipalign -v -p 4 "$APK_PATH" app-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks release-key.jks \
            --ks-key-alias mykey \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out app-release-signed.apk \
            app-aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Image-Reducer-Release-APK
          path: |
            app-release-signed.apk
            release-key.jks
